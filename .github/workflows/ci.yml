name: CI

on:
  push:
    branches: ["feat/core-v0"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test parser
        run: npm run test

      - name: Build
        run: npm run build
